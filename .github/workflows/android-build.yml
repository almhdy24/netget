name: Android CI & Release Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify NetGet Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install NDK 29
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.14206865" || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analysis
        run: flutter analyze

      - name: Run Test Suite
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Stage Release APK Artifact
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/NetGet-v1.0.0-release.apk
          ls -la output/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netget-release-apk
          path: output/NetGet-v1.0.0-release.apk
          retention-days: 14
