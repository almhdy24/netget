name: netget
description: "NetGet – Download Manager for Android"
publish_to: 'none'
version: 1.0.0-rc2+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  path: ^1.9.1
  open_filex: ^4.7.0
  share_plus: ^13.3.0
  almhdy_analytics:
    path: packages/almhdy_analytics

dependency_overrides:
  path_provider_android: '>=2.2.0 <2.3.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

