<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Slate Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A222D"/>
      <stop offset="50%" stop-color="#121820"/>
      <stop offset="100%" stop-color="#0B1015"/>
    </linearGradient>

    <!-- Desert Amber to Warm Sand Motion Gradient -->
    <linearGradient id="amberSandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E09F3E"/>
      <stop offset="100%" stop-color="#F3D2A2"/>
    </linearGradient>

    <!-- Nile Blue to River Indigo Motion Gradient -->
    <linearGradient id="nileIndigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26A69A"/>
      <stop offset="100%" stop-color="#0F4C5C"/>
    </linearGradient>

    <!-- Warm Sand to Desert Amber Hero Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3D2A2"/>
      <stop offset="100%" stop-color="#E09F3E"/>
    </linearGradient>

    <!-- Subtle Amber Glow Filter -->
    <filter id="arrowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#E09F3E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark Slate Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#E09F3E" stroke-width="2" stroke-opacity="0.25"/>

  <!-- «خيوط» (Threads) Multi-segment Speed Streams -->
  <g stroke-linecap="round">
    <!-- Left upper stream (Desert Amber & Warm Sand packets) -->
    <path d="M 72,160 L 118,160" stroke="#C85A32" stroke-width="8" opacity="0.7"/>
    <path d="M 54,188 L 126,188" stroke="url(#amberSandGrad)" stroke-width="8" opacity="0.9"/>
    <path d="M 78,216 L 120,216" stroke="#F3D2A2" stroke-width="8"/>

    <!-- Right lower stream (Nile Blue & River Indigo packets) -->
    <path d="M 392,296 L 434,296" stroke="#26A69A" stroke-width="8"/>
    <path d="M 386,324 L 458,324" stroke="url(#nileIndigoGrad)" stroke-width="8" opacity="0.9"/>
    <path d="M 394,352 L 440,352" stroke="#1B3B6F" stroke-width="8" opacity="0.7"/>

    <!-- Motion Chevron / Reception Tray (Clay Terracotta) -->
    <path d="M 194,408 L 256,432 L 318,408" fill="none" stroke="#C85A32" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <!-- Distinctive White N Symbol -->
  <g>
    <!-- Left vertical stem -->
    <rect x="136" y="122" width="48" height="268" rx="10" fill="#FAFAF9"/>
    <!-- Right vertical stem -->
    <rect x="328" y="122" width="48" height="268" rx="10" fill="#FAFAF9"/>
    <!-- Diagonal stroke with negative space cutouts for the central arrow -->
    <!-- Top-left diagonal segment -->
    <path d="M 184,142 L 234,212 L 184,236 Z" fill="#FAFAF9"/>
    <!-- Bottom-right diagonal segment -->
    <path d="M 328,370 L 278,300 L 328,276 Z" fill="#FAFAF9"/>
  </g>

  <!-- Warm Amber Download Arrow (Hero Element) -->
  <g filter="url(#arrowGlow)">
    <!-- Arrow Backing Cutout (ensures crisp separation from the white N) -->
    <path d="M 234,108 C 234,101.5 239.5,96 246,96 L 266,96 C 272.5,96 278,101.5 278,108 L 278,278 L 328,278 L 256,368 L 184,278 L 234,278 Z" fill="#121820" stroke="#121820" stroke-width="16" stroke-linejoin="round"/>

    <!-- The Arrow Itself -->
    <path d="M 234,108 C 234,101.5 239.5,96 246,96 L 266,96 C 272.5,96 278,101.5 278,108 L 278,278 L 328,278 L 256,368 L 184,278 L 234,278 Z" fill="url(#arrowGrad)" stroke="#E09F3E" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
